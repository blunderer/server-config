# /etc/tmux.conf, installed by box packages (host/tmux/tmux.conf).
# A user's ~/.tmux.conf is read after this file and can override it.

# Prefix: Ctrl+S (instead of Ctrl+B). Ctrl+S Ctrl+S sends it to the program.
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Modern terminal inside tmux: 256 colours, 24-bit colour, styled
# underlines, hyperlinks and clipboard, when the outer terminal has them.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:usstyle:hyperlinks:clipboard"
set -g set-clipboard on
set -g focus-events on

# Quieter and more forgiving defaults.
set -sg escape-time 10
set -g history-limit 50000
# No mouse: the terminal keeps selecting and copying text as usual.
# Scroll back with Ctrl+S [ then PageUp/arrows, q to leave.
set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
