# nginx main configuration (rendered by srv). Sites are in sites/*.conf.

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	charset utf-8;

	access_log /dev/stdout;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;
	server_tokens off;
	autoindex off;
	client_max_body_size 100m;

	# Podman's aardvark-dns on the bridge gateway, for dynamic upstream lookups.
	resolver @podman_web_gw@ valid=10s ipv6=off;

	# Requests from tor arrive on a unix socket (sites/20-onion.conf): nginx
	# then has no address or port to give PHP (REMOTE_ADDR "unix:", empty
	# SERVER_PORT), and scripts that use them can stop half-way through a
	# page. PHP gets what the old onion server (tor -> 127.0.0.1:8080) gave.
	map $remote_addr $srv_remote_addr {
		"unix:"  127.0.0.1;
		default  $remote_addr;
	}
	map $remote_port $srv_remote_port {
		""       0;
		default  $remote_port;
	}
	map $server_addr $srv_server_addr {
		~^unix:  127.0.0.1;
		default  $server_addr;
	}
	map $server_port $srv_server_port {
		""       80;
		default  $server_port;
	}
	map $https $hsts_header {
		"on"     "max-age=31536000";
		default  "";
	}

	# Direct *.@host@.@domain@ SSO redirects to this host's own auth.@host@.@domain@
	# instead of auth.@domain@ (which points to the web= host).
	map $host $sso_auth_host {
		hostnames;
		*.@host@.@domain@  auth.@host@.@domain@;
		default            auth.@domain@;
	}

	# Per-domain Google SSO allowlists, generated from /users/websso/<domain>
	# at start and on `srv reload web` (entrypoint.d/60-srv-websso-map.sh).
	include /tmp/websso-allowed.conf;

	gzip on;
	gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

	# TLS for every HTTPS site: one certificate covering all names
	# (ssl/renew.sh: every domain and its wildcard).
	ssl_certificate     /keys/ssl/blunderer.org/fullchain.crt;
	ssl_certificate_key /keys/ssl/blunderer.org/blunderer.org.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# Local-only endpoint for the container healthcheck.
	server {
		listen 127.0.0.1:8081;
		location = /healthz {
			access_log off;
			return 200 "ok\n";
		}
	}

	include /etc/nginx/sites/*.conf;
}
