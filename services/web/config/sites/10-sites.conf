# HTTPS sites, converted from the old lighttpd.conf host rules.
# Hosts not matched below (mariage, 27aout2011, home, cloud, code, git...)
# get the default site, as before.

# Default: blunderer.org, www., backup. and every other name.
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;
	server_name _;
	root /www/blunderer.org/www;
	@onion_location@
	include /etc/nginx/snippets/site.conf;
}

# Host names themselves (orion, lyra, vega) are not served under <host>.<domain>.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name @host_excluded_names@;
	include /etc/nginx/snippets/headers.conf;
	return 404;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name ~^jellyfin\.(@host@\.)?blunderer\.(org|net|fr)$;
	include /etc/nginx/snippets/headers.conf;

	# Resolved through Docker's DNS (nginx.conf), so nginx starts whether
	# jellyfin is deployed here or not, and follows container restarts.
	location / {
		set $jellyfin_upstream http://jellyfin:8096;
		proxy_pass $jellyfin_upstream;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		# Buffer up to 2 MiB in RAM per stream to smooth Wi-Fi/WAN jitter without
		# ever spilling multi-GiB DirectPlay range responses to disk temp files.
		proxy_buffering on;
		proxy_max_temp_file_size 0;
		proxy_buffer_size 16k;
		proxy_buffers 32 64k;
		proxy_busy_buffers_size 128k;
	}

	location /socket {
		set $jellyfin_upstream http://jellyfin:8096;
		proxy_pass $jellyfin_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name auth.@domain@ auth.@host@.@domain@;
	include /etc/nginx/snippets/headers.conf;

	location /oauth2/ {
		set $sso_upstream http://127.0.0.1:4180;
		proxy_pass $sso_upstream;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Uri $request_uri;
		proxy_buffer_size 16k;
		proxy_buffers 4 16k;
	}

	location = /robots.txt {
		set $sso_upstream http://127.0.0.1:4180;
		proxy_pass $sso_upstream;
	}

	location = / {
		if ($host = auth.@host@.@domain@) {
			return 302 https://@host@.@domain@/;
		}
		return 302 https://@domain@/;
	}

	location / {
		return 404;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name torrent.@domain@ torrent.@host@.@domain@;
	include /etc/nginx/snippets/headers.conf;
	include /etc/nginx/snippets/sso.conf;

	# Resolved through container DNS (nginx.conf), so nginx starts whether
	# torrent is deployed here or not, and follows container restarts.
	location / {
		set $torrent_upstream http://torrent:9091;
		proxy_pass $torrent_upstream;
		proxy_redirect http://$host/ https://$host/;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Auth-User $sso_user;
		proxy_set_header X-Auth-Email $sso_email;
	}
}

