# Google SSO via oauth2-proxy on auth.@domain@ (or auth.@host@.@domain@, include in any HTTPS server {}).
# Authorizes against <data>/users/websso/<host> (reload with `srv reload web`),
# and sets $sso_user / $sso_email for backends that want the identity.
auth_request /_sso_auth;
auth_request_set $sso_user $upstream_http_x_auth_request_user;
auth_request_set $sso_email $upstream_http_x_auth_request_email;
auth_request_set $sso_cookie $upstream_http_set_cookie;
add_header Set-Cookie $sso_cookie;
error_page 401 = @sso_signin;

location = /_sso_auth {
	internal;
	auth_request off;
	set $sso_upstream http://127.0.0.1:4180/oauth2/auth?allowed_emails=$sso_allowed_emails;
	proxy_pass $sso_upstream;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $http_host;
	proxy_set_header X-Forwarded-Uri $request_uri;
	proxy_set_header Content-Length "";
	proxy_pass_request_body off;
}

location @sso_signin {
	auth_request off;
	if ($request_method !~ ^(GET|HEAD)$) {
		return 401;
	}
	if ($http_x_requested_with = XMLHttpRequest) {
		return 401;
	}
	return 302 https://$sso_auth_host/oauth2/sign_in?rd=$scheme://$http_host$request_uri;
}
