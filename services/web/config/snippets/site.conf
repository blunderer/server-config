# Common settings for every site (equivalent of the old lighttpd globals).
index index.php index.html index.htm default.htm;

include /etc/nginx/snippets/headers.conf;

# Old rule url.access-deny = ("~", ".inc")
location ~ (~|\.inc)$ {
	deny all;
}
# Old rule static-file.exclude-extensions = (".php", ".pl", ".fcgi"): never
# send these as files. PHP runs below; Perl and FastCGI scripts did not run
# on the old server either (no handler), they returned 403.
location ~ \.(pl|fcgi)$ {
	deny all;
}
# Block all dotfiles (.env, .git, .ht*, .user.ini...) except /.well-known/.
location ~ /\.(?!well-known/) {
	deny all;
}

# Let's Encrypt HTTP-01 challenges: the old getssl wrote to <data>/www/acme.
# srv renews through DNS (ssl/renew.sh); kept while the old stack renews.
location ^~ /.well-known/acme-challenge/ {
	root /www/acme;
	autoindex off;
}

# PHP, including URLs with a path after the script (/index.php/some/page,
# PATH_INFO), which lighttpd's .php handler accepted too.
location ~ [^/]\.php(/|$) {
	fastcgi_split_path_info ^(.+?\.php)(/.*)$;
	# Not try_files: it would clear $fastcgi_path_info.
	if (!-f $document_root$fastcgi_script_name) {
		return 404;
	}
	include fastcgi_params;
	# Addresses PHP can use for unix-socket (onion) requests too (nginx.conf);
	# PHP-FPM keeps the last value of a repeated parameter.
	fastcgi_param REMOTE_ADDR $srv_remote_addr;
	fastcgi_param REMOTE_PORT $srv_remote_port;
	fastcgi_param SERVER_ADDR $srv_server_addr;
	fastcgi_param SERVER_PORT $srv_server_port;
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_param PATH_INFO $fastcgi_path_info;
	fastcgi_param HTTPS $https if_not_empty;
	fastcgi_param HTTP_PROXY "";
	fastcgi_pass 127.0.0.1:9000;
}
