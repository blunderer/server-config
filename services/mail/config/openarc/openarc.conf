# OpenARC: verify existing ARC sets and seal every message passing through
# (Mode sv). The old file had "Mode v": it verified but never sealed, so Gmail
# never saw blunderer.org vouching for forwarded mail.
Mode                    sv
AuthservID              @server_name@
Domain                  blunderer.org
# Same key and selector as DKIM (mail._domainkey.blunderer.org): no DNS change.
Selector                s202611
KeyFile                 /keys/blunderer.org/s202611.private
Canonicalization        relaxed/relaxed
SignatureAlgorithm      rsa-sha256
InternalHosts           /etc/srv/openarc/InternalHosts
Socket                  inet:12302@127.0.0.1
Syslog                  yes
Background              false
