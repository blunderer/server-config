# OpenDKIM: signs mail from local and authenticated users, verifies the rest
# (the result is recorded in Authentication-Results for OpenARC to seal).
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
UMask                   002

Mode                    sv
Canonicalization        relaxed/simple
SignatureAlgorithm      rsa-sha256
OversignHeaders         From
# Must match OpenARC's AuthservID so OpenARC seals these results.
AuthservID              @server_name@

# Only the container itself is internal. The old file listed "*", which made
# every host on the internet "internal": spoofed mail from outside got signed
# with our keys.
InternalHosts           refile:/etc/srv/opendkim/InternalHosts
ExternalIgnoreList      refile:/etc/srv/opendkim/InternalHosts

KeyTable                refile:/etc/srv/opendkim/KeyTable
SigningTable            refile:/etc/srv/opendkim/SigningTable

Socket                  inet:12301@127.0.0.1
