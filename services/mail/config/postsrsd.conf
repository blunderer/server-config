# PostSRSd: Sender Rewriting Scheme for forwarded mail (see docs/mail.md).
# Mail from these domains is ours and is not rewritten.
domains = { "blunderer.org", "lelong.xyz", "n.lelong.xyz", "rion.lelong.xyz", "libroxml.net", "libroxml.com" }
srs-domain = "blunderer.org"
socketmap = "inet:127.0.0.1:10003"
# Shared by all hosts (in the replicated data folder): a bounce to an address
# rewritten by one server can then be decoded by any of them.
secrets-file = "/etc/srv/postsrsd.secret"
chroot-dir = ""
unprivileged-user = "nobody"
