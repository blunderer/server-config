# Recursive resolver for the mail containers (services/mail/compose.yml).
# Reachable only on the srv-mail network (no published port); answers only the
# srv-mail network and itself. See docs/mail.md, "DNS blocklists".
server:
	verbosity: 1
	use-syslog: no
	logfile: ""
	pidfile: ""
	username: "unbound"
	chroot: ""
	directory: "/etc/unbound"

	interface: 127.0.0.1
	port: 53
	do-ip4: yes
	# Docker's IPv6 egress depends on the host; IPv4 is always there, and a
	# missing IPv6 path would only add timeouts to every mail lookup.
	do-ip6: no
	do-udp: yes
	do-tcp: yes

	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow

	root-hints: "/usr/share/dns/root.hints"
	auto-trust-anchor-file: "/var/lib/unbound/root.key"

	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	prefetch: yes
	num-threads: 1

remote-control:
	# Local socket only, for the healthcheck (unbound-control status).
	control-enable: yes
	control-interface: /run/unbound.ctl
	control-use-cert: no
