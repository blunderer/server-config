# What a score leads to. rspamd_reject comes from spam_reject in the host
# files: "null" (the default) only tags, a score (e.g. 15) rejects at SMTP
# time from that score up, so the sender's server gets the bounce and Gmail
# never sees the message. No greylisting (it needs redis) and no subject
# rewriting (it would break DKIM when forwarding).
reject = @rspamd_reject@;
add_header = 6;
greylist = null;
rewrite_subject = null;
