# postfix-policyd-spf-python: annotate only, never reject. The result goes
# into an Authentication-Results header that OpenARC seals.
debugLevel = 1
TestOnly = 1
HELO_reject = False
Mail_From_reject = False
PermError_reject = False
TempError_Defer = False
Header_Type = AR
Authserv_Id = @server_name@
skip_addresses = 127.0.0.0/8,::ffff:127.0.0.0/104,::1
