// BIND configuration, rendered by srv.
// dns_role (master on the leader, slave elsewhere) picks the zone definitions.

// Slaves (every host of the inventory but the leader): allowed to transfer
// the zones when signed with xfer-tsig, and notified of every change.
acl secondaries { @dns_slaves_list@ };
include "/etc/srv/xfer-tsig.key";

options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { any; };

	// Authoritative only. The old setup allowed recursion for anyone, which
	// made the server an open resolver (abused for DNS amplification attacks).
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	dnssec-validation auto;
	version none;
	rate-limit {
		responses-per-second 10;
		window 5;
	};
};

logging {
	channel console {
		stderr;
		severity info;
		print-time yes;
		print-category yes;
	};
	category default { console; };
	category lame-servers { null; };
};

include "/etc/bind/zones-@dns_role@.conf";
