// Zones served by the leader (dns_role=master). The other hosts of the
// inventory are the only ones allowed to transfer, and are notified of every
// change, even those not in the NS records (e.g. vega).

// Let's Encrypt DNS-01 challenges: the only dynamically updated zone, so the
// zones above stay exactly what srv rendered. Each domain has a fixed
// _acme-challenge CNAME into it; ssl/renew.sh (lego) writes the TXT records,
// signed with this key, and only TXT records below acme.blunderer.org.
include "/etc/srv/acme-tsig.key";

// Sign outgoing NOTIFY packets to every secondary with xfer-tsig.
@dns_slave_servers@

zone "acme.blunderer.org" {
	type primary;
	// In the dns-lib volume folder (BIND writes it); created by hooks/prepare.
	file "/var/lib/bind/acme.blunderer.org.zone";
	// TXT for the challenges; NS at the apex for hooks/post-switch (ns=).
	update-policy {
		grant acme-update subdomain acme.blunderer.org. TXT;
		grant acme-update name acme.blunderer.org. NS;
	};
	allow-transfer { !{ !secondaries; any; }; key xfer-tsig; };
	also-notify { @dns_slaves_list@ };
};

// The submission name smtp.blunderer.org, when smtp= is set (inventory): a
// primary on every host, kept by its own box smtp-health.
@smtp_zone@

zone "blunderer.org" {
	type primary;
	file "/etc/bind/zones/blunderer.org.zone";
	allow-transfer { !{ !secondaries; any; }; key xfer-tsig; };
	also-notify { @dns_slaves_list@ };
};

