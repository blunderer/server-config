// Zones served by every host but the leader (dns_role=slave): transferred
// from the leader (dns_master) signed with xfer-tsig and stored in dns-lib.

server @dns_master@ {
	keys { xfer-tsig; };
};

zone "acme.blunderer.org" {
	type secondary;
	primaries { @dns_master@ key xfer-tsig; };
	// Not the primary's file name: a host that was the leader keeps its copy.
	file "/var/lib/bind/acme.blunderer.org.secondary";
};

// smtp.blunderer.org, when smtp= is set (inventory): a primary on every
// host, kept by its own box smtp-health (not transferred from the leader).
@smtp_zone@

zone "blunderer.org" {
	type secondary;
	primaries { @dns_master@ key xfer-tsig; };
	file "/var/lib/bind/blunderer.org.zone";
};

zone "lelong.xyz" {
	type secondary;
	primaries { @dns_master@ key xfer-tsig; };
	file "/var/lib/bind/lelong.xyz.zone";
};

zone "libroxml.net" {
	type secondary;
	primaries { @dns_master@ key xfer-tsig; };
	file "/var/lib/bind/libroxml.net.zone";
};

zone "libroxml.com" {
	type secondary;
	primaries { @dns_master@ key xfer-tsig; };
	file "/var/lib/bind/libroxml.com.zone";
};
