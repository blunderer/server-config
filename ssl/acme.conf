# Let's Encrypt certificate, renewed by ssl/renew.sh with lego (DNS-01).
# Sourced by renew.sh: plain shell assignments only.

ACME_EMAIL="tristan@lelong.xyz"

# One certificate: every domain and its wildcard, plus per-host wildcards
# (*.<host>.blunderer.org, added by ssl/renew.sh from hosts= in the
# inventory), so a new subdomain needs no change here. A new domain needs its
# _acme-challenge CNAME to <domain>.acme.blunderer.org. in its zone
# (services/dns/config/zones/); each host gets _acme-challenge.<host> in
# blunderer.org.zone.
ACME_DOMAINS="blunderer.org *.blunderer.org lelong.xyz *.lelong.xyz libroxml.net *.libroxml.net libroxml.com *.libroxml.com"

# RSA, as before: the widest compatibility for mail clients and servers.
ACME_KEY_TYPE="RSA2048"

# renovate: datasource=docker depName=docker.io/goacme/lego
LEGO_IMAGE="docker.io/goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd"
